<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <filter id="yellowGlow" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#FFCC00" flood-opacity="0.9"/>
  </filter>

  <g filter="url(#yellowGlow)">
    <!-- White Belt main body with Yellow Border -->
    <polygon points="4,28 26,6 32,12 10,34" fill="#FFFFFF" stroke="#FFCC00" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Black Rank Bar (Tarja Preta) -->
    <polygon points="19,13 26,6 32,12 25,19" fill="#121212"/>
    
    <!-- White Rank Stripe -->
    <line x1="24" y1="8" x2="28" y2="12" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="21" y1="11" x2="25" y2="15" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
