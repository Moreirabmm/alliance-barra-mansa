<svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 36 36">
  <!-- Outer drop shadow for contrast against dark & light backgrounds -->
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="1" dy="2" stdDeviation="1.5" flood-color="#000" flood-opacity="0.8"/>
  </filter>

  <g filter="url(#shadow)">
    <!-- White Belt main body -->
    <polygon points="4,28 26,6 32,12 10,34" fill="#FFFFFF" stroke="#121212" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Black Rank Bar (Tarja Preta da Faixa) -->
    <polygon points="19,13 26,6 32,12 25,19" fill="#121212"/>
    
    <!-- White Rank Degree Stripe -->
    <line x1="24" y1="8" x2="28" y2="12" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="21" y1="11" x2="25" y2="15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Yellow Belt Tip Accent -->
    <line x1="6" y1="26" x2="8" y2="32" stroke="#FFCC00" stroke-width="2"/>
  </g>
</svg>
